databases:
  # Base de datos PostgreSQL
  - name: tmdb-db
    databaseName: tmdb
    user: tmdb_user
    plan: free

services:
  # Aplicación Web (Backend + Frontend)
  - type: web
    name: tmdb-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tmdb-db
          property: connectionString
      - key: SECRET
        generateValue: true
      - key: API_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: HOST_MAILER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SERVER_PORT
        value: 3001
